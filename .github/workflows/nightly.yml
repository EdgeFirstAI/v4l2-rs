name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      # `inputs` is null on a schedule trigger, so the fallback is required;
      # without it the expression yields an empty string and the gate's
      # boolean input rejects it.
      force: ${{ inputs.force || false }}

  # Deliberately not `needs: changed`. cargo audit answers a question about
  # the RustSec database, not about the code, so gating it would go quiet
  # exactly when a new advisory lands against an unchanged main. It reads
  # Cargo.lock without building, on a free standard runner, so running it
  # every night costs nothing.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      lanes: all
      nightly: true
      runner-class-linux: hosted
      boards: camera-v4l2
      skip-macos: true
      skip-windows: true
      # As in ci.yml: the hosted lanes load vivid and vim2m so their coverage
      # includes the device tests, and the main-branch analysis is uploaded to
      # SonarCloud. Pull requests are analysed by ci.yml's full tier.
      pre-command: scripts/load-vivid.sh
      board-pre-command: "true"
      gpu-pre-command: "true"
      sonar: true
    secrets: inherit
