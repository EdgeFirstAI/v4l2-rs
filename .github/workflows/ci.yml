name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      hardware:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No workflow-level `permissions`. A grant here is inherited by every job
# whether it needs it or not, which is what SonarCloud's githubactions:S8264
# reports and what least privilege argues against. Each job below declares
# what it uses; the reusable-workflow calls declare theirs inside the shared
# workflow.

jobs:
  # Runs on draft pull requests too: PRs stay in draft until ci-gate is
  # green, as in the camera repository.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read        # checkout
      pull-requests: read   # paths-filter compares the PR through the API
    outputs:
      code: ${{ steps.f.outputs.code }}
      full: ${{ steps.mode.outputs.full }}
      hardware: ${{ steps.mode.outputs.hardware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/**'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_FULL: ${{ inputs.full }}
          DISPATCH_HARDWARE: ${{ inputs.hardware }}
        run: |
          full=false
          hardware=false
          case "$EVENT_NAME" in
            merge_group) full=true ;;
            workflow_dispatch)
              full="$DISPATCH_FULL"
              hardware="$DISPATCH_HARDWARE"
              ;;
          esac
          # Re-run Full on later pushes while the label is still present.
          case ",$LABELS," in *,ci:full,*) full=true ;; esac
          case ",$LABELS," in *,ci:hardware,*) hardware=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"

  quick:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-quick.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      python: false

  # Buffer-queue integration tests against the kernel's virtual drivers:
  # vivid (one single-planar and one multi-planar capture node) and vim2m
  # (memory-to-memory). The modules ship in linux-modules-extra for the
  # runner's kernel. When the archive has not caught up with the runner image
  # the job warns and skips the tests instead of failing; any other setup
  # failure fails the job.
  vivid:
    name: V4L2 queues (vivid, vim2m)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read        # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Load vivid and vim2m
        id: drivers
        run: |
          set -euo pipefail
          uname -r
          sudo apt-get update -q
          if ! sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"; then
            echo "::warning::linux-modules-extra-$(uname -r) is not in the archive; vivid tests skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo modprobe vivid n_devs=2 node_types=0x1,0x1 multiplanar=1,2
          sudo modprobe vim2m
          # udev creates and permissions the nodes after modprobe returns;
          # wait for it, or it resets the modes changed below.
          sudo udevadm settle
          sudo chmod a+rw /dev/video* /dev/dma_heap/system
          ls -l /dev/video* /dev/dma_heap/system
          for d in /sys/class/video4linux/video*; do echo "$(basename "$d"): $(cat "$d/name")"; done
          echo "available=true" >> "$GITHUB_OUTPUT"
      # rust-toolchain.toml is the single source of the compiler version.
      - name: Install the pinned toolchain
        if: steps.drivers.outputs.available == 'true'
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        if: steps.drivers.outputs.available == 'true'
        with:
          shared-key: vivid
          cache-on-failure: true
          cache-bin: false
      - name: Queue tests
        if: steps.drivers.outputs.available == 'true'
        env:
          EDGEFIRST_V4L2_REQUIRE_VIVID: "1"
        run: cargo test --locked --test vivid

  full:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      lanes: ${{ needs.changes.outputs.full == 'true' && 'all' || 'hardware' }}
      # Real V4L2 capture nodes (ISI and vvcam on i.MX 8M Plus) for the
      # capture tests. M2M codec boards are added with device tests for the
      # m2m helpers.
      boards: camera-v4l2
      # The crate is Linux-only and compiles to nothing elsewhere, so the
      # macOS and Windows lanes would build an empty crate.
      skip-macos: true
      skip-windows: true
      # No SonarCloud project yet.
      sonar: false
    secrets: inherit

  ci-gate:
    if: always()
    needs: [changes, quick, vivid, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Reads its own `needs` context and nothing else.
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
