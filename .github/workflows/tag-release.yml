name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257  # v2.3.1
    with:
      # No tag unless the release build is green for the release-branch head
      # being merged -- the PR's head SHA, which is where the build ran, not
      # the new commit a squash merge creates. Branch protection requires ci-gate only, and the release build
      # runs on a branch push rather than on the PR, so this is the one place
      # "the artifacts exist before the tag does" is actually enforced.
      # Leave it empty in a repository whose release still builds on the tag.
      require-build: release.yml
    secrets: inherit
