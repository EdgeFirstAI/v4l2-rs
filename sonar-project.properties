# SonarCloud analysis for edgefirst-v4l2. The full CI tier runs the scan
# (EdgeFirstAI/.github rust-full.yml) and passes the merged lcov of the linux
# and linux-arm lanes, which run the vivid and vim2m device tests, and of the
# camera-v4l2 boards through -Dsonar.rust.lcov.reportPaths.

sonar.organization=edgefirstai
sonar.projectKey=EdgeFirstAI_v4l2-rs
sonar.projectName=EdgeFirst V4L2

sonar.sources=src,examples,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The examples are command-line demonstrations and the scripts are developer
# tools; no test runs them, so they would only dilute the coverage figure.
sonar.coverage.exclusions=examples/**,scripts/**

sonar.host.url=https://sonarcloud.io
